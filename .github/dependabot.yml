# Dependabot config — tailored 2026-05-28 by Dren Group Cowork
# Pattern audit: detected manifests present in repo, declared only those.
# - Group GH Actions bumps into ONE weekly PR
# - Group npm patch + minor bumps into ONE weekly PR per directory
# - Ignore MAJOR version bumps (need manual review)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "09:00", timezone: "America/Santo_Domingo" }
    open-pull-requests-limit: 3
    groups:
      gh-actions-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "[deps]" }
    labels: ["dependencies", "github-actions"]
